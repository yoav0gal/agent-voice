[project]
name = "agent-voice"
version = "0.8.0"
description = "Local, free voice artifacts for AI agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "audio", "cli", "kokoro", "speech", "text-to-speech", "tts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "filelock>=3.20,<4",
  "imageio-ffmpeg==0.6.0",
  "kokoro-onnx==0.5.0",
  "linkify-it-py>=2,<3",
  "markdown-it-py>=4.2,<5",
  "miniaudio==1.71",
  "numpy>=2,<3",
  "pygments>=2.19,<3",
]

[project.urls]
Repository = "https://github.com/yoav0gal/agent-voice"
Issues = "https://github.com/yoav0gal/agent-voice/issues"

[project.scripts]
agent-voice = "agent_voice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/.agents", "/skills-lock.json"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
