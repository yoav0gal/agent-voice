[project]
name = "kokoro-cli"
version = "0.2.0"
description = "Offline-first Kokoro text-to-speech CLI and localhost service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["agents", "cli", "kokoro", "speech", "text-to-speech", "tts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "kokoro-onnx==0.5.0",
]

[project.urls]
Repository = "https://github.com/yoav0gal/kokoro-cli"
Issues = "https://github.com/yoav0gal/kokoro-cli/issues"

[project.scripts]
kokoro = "kokoro_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
