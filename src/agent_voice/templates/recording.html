<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src data:; media-src 'self'; style-src 'unsafe-inline'"
  >
  <link rel="icon" type="image/svg+xml" sizes="any" href="$BRAND_ICON">
  <title>$PAGE_TITLE</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #fffaf7;
      --foreground: #211c1a;
      --muted: #746761;
      --surface: #f2ebe7;
      --border: #d8cec8;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--background);
      color: var(--foreground);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #171311;
        --foreground: #f7f3eb;
        --muted: #b9aaa2;
        --surface: #26201d;
        --border: #493d37;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 1.5rem 1rem;
      background: var(--background);
    }

    main {
      width: min(100%, 32rem);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      margin-bottom: 1rem;
    }

    header img {
      width: 2.5rem;
      height: 2.5rem;
    }

    h1 {
      margin: 0;
      font-size: 1.125rem;
    }

    header p {
      margin: 0.125rem 0 0;
      color: var(--muted);
      font-size: 0.8125rem;
      overflow-wrap: anywhere;
    }

    audio {
      display: block;
      width: 100%;
    }

    .hint {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.4;
    }

    details {
      margin-top: 1rem;
      border-top: 1px solid var(--border);
      padding-top: 0.875rem;
    }

    summary {
      cursor: pointer;
      font-weight: 650;
      font-size: 0.875rem;
    }

    .narration {
      margin: 0.75rem 0 0;
      padding: 0.875rem;
      border-radius: 0.5rem;
      background: var(--surface);
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="$BRAND_ICON" alt="" width="128" height="128" aria-hidden="true">
      <div>
        <h1>Agent Voice</h1>
        <p>$RECORDING_NAME</p>
      </div>
    </header>
    <audio controls preload="metadata">
      <source src="$MEDIA_SOURCE" type="$MEDIA_TYPE">
      <a href="$MEDIA_SOURCE">Open the recording</a>
    </audio>
    <p class="hint">Listen here. Read the full response in your conversation.</p>
    <details>
      <summary>Narration text</summary>
      <p class="narration">$RESPONSE_TEXT</p>
    </details>
  </main>
</body>
</html>
