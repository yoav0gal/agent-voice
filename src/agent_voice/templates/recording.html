<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src data:; media-src 'self'; style-src 'unsafe-inline'"
  >
  <link
    rel="icon"
    type="image/svg+xml"
    sizes="any"
    href="$BRAND_ICON"
  >
  <title>$PAGE_TITLE</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fffaf7;
      color: #211c1a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
    }

    main {
      width: min(100%, 48rem);
      margin: 0 auto;
    }

    .brand {
      margin-bottom: 2rem;
    }

    .brand-logo {
      display: block;
      width: min(100%, 15rem);
      height: auto;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.5rem, 4vw, 2rem);
      overflow-wrap: anywhere;
    }

    h2 {
      margin: 2rem 0 0.75rem;
      font-size: 0.875rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .recording {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .recording-icon {
      flex: 0 0 auto;
      width: 2rem;
      height: 2rem;
      object-fit: contain;
    }

    audio {
      display: block;
      min-width: 0;
      width: 100%;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: inherit;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <img
        class="brand-logo"
        src="$BRAND_LOGO"
        alt="Agent Voice"
        width="480"
        height="205"
      >
    </header>
    <h1>$RECORDING_NAME</h1>
    <div class="recording">
      <img
        class="recording-icon"
        src="$BRAND_ICON"
        alt=""
        width="128"
        height="128"
        aria-hidden="true"
      >
      <audio controls preload="metadata">
        <source src="$MEDIA_SOURCE" type="$MEDIA_TYPE">
        <a href="$MEDIA_SOURCE">Open the recording</a>
      </audio>
    </div>
    <section aria-labelledby="response-heading">
      <h2 id="response-heading">Response</h2>
      <pre>$RESPONSE_TEXT</pre>
    </section>
  </main>
</body>
</html>
